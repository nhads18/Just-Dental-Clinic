name: Deploy to Staging

on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Create staging directory if it doesn't exist
            mkdir -p ${{ secrets.STAGING_PATH }}
            
            # Clone or pull staging branch
            if [ -d ${{ secrets.STAGING_PATH }}/.git ]; then
              cd ${{ secrets.STAGING_PATH }}
              git pull origin staging
            else
              git clone -b staging ${{ secrets.REPO_URL }} ${{ secrets.STAGING_PATH }}
              cd ${{ secrets.STAGING_PATH }}
            fi
            
            # Copy .env from production (or create new one)
            if [ ! -f .env ]; then
              cp ${{ secrets.PUBLIC_HTML_PATH }}/.env .env
              # Update APP_ENV to staging
              sed -i 's/APP_ENV=production/APP_ENV=staging/' .env
              sed -i 's/APP_DEBUG=false/APP_DEBUG=true/' .env
            fi
            
            # Run Laravel commands
            php artisan migrate --force
            php artisan config:clear
            php artisan view:clear
            chmod -R 775 storage bootstrap/cache
