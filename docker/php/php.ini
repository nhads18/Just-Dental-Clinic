; Local dev PHP settings for the Just Dental Clinic app container.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M

; Enable opcache for the CLI built-in server (`php artisan serve`) so the
; long-lived server process caches compiled scripts across requests.
opcache.enable = 1
opcache.enable_cli = 1
; validate_timestamps=0: opcache holds bytecode in memory and does NOT stat files
; per request. Essential for performance over the slow Windows bind mount.
; Trade-off: restart `php artisan serve` after editing PHP files.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
